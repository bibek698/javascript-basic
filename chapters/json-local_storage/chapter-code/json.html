<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
</head>
<body>
    <script>
        let product = {
            name: 'Shirt',
            price: 700,
            rating: {
                stars: 4,
                noOfReviews: 550,
            },
        };
        console.log(typeof product);
        let str = JSON.stringify(product);
        console.log(typeof str);
    </script>
</body>
</html>
